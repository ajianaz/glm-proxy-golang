# docker-compose.local.yml - for local testing WITHOUT domain/Traefik
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  glm-proxy:
    build: .
    container_name: glm-proxy-local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-glm-4.7}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
      - DATA_FILE=/app/data/apikeys.json
    volumes:
      - ./data:/app/data:rw
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
